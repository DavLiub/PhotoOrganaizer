name: Nightly Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  night-flutter:
    name: Night Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run night-tagged tests
        run: flutter test --tags night

      - name: Build debug APK
        run: flutter build apk --debug

  night-guards:
    name: Night Project Guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all architecture layers
        run: python tools/ci/architecture_guard.py --all

      - name: Check all test/debug imports
        run: python tools/ci/test_import_guard.py --all

      - name: Check all SDK/plugin leaks
        run: python tools/ci/sdk_leak_guard.py --all

      - name: Check all secrets
        run: python tools/ci/secret_guard.py --all

      - name: Report all naming recommendations
        run: python tools/ci/naming_report.py --all
